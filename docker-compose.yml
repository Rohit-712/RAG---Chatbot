services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: rag-chatbot-backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    environment:
      # If Ollama runs directly on the host machine:
      OLLAMA_HOST: http://host.docker.internal:11434

    volumes:
      # Keep uploaded documents outside the image
      - ./backend/uploads:/app/uploads

      # Keep generated vector-store data outside the container
      - ./backend/vector_store:/app/vector_store

      # Keep application data/database outside the container
      - ./backend/data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped